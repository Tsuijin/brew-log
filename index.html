<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Brew Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brew Log">
<meta name="theme-color" content="#121620">
<!-- deploy.sh がデプロイ日時を焼き込む。curl して公開版の鮮度を確認するための印。 -->
<meta name="app-version" content="2026-08-01 19:23">
<style>
  :root {
    --bg-color: #121620;
    --card-bg: #1C2230;
    --card-bg-2: #232A3A;
    --accent-color: #D19A66;
    --accent-color-strong: #E4B483;
    --text-color: #E8ECF2;
    --sub-text: #8C93A3;
    --border-color: #262C3A;
    --danger: #C97B6E;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg-color);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(209,154,102,0.06) 0%, transparent 45%),
      radial-gradient(circle at 90% 30%, rgba(209,154,102,0.05) 0%, transparent 40%);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overscroll-behavior-y: none;
  }
  .app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-bottom: calc(70px + var(--safe-bottom));
  }
  header {
    padding: calc(18px + var(--safe-top)) 20px 12px;
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(var(--bg-color) 70%, transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 { font-size: 22px; font-weight: 800; display:flex; align-items:center; gap:8px; }
  h1 .hicon { font-size: 19px; }
  .header-icon-btn {
    background: var(--card-bg); border: 1px solid var(--border-color);
    color: var(--text-color); width: 40px; height: 40px; border-radius: 12px;
    font-size: 16px; cursor:pointer; flex-shrink:0; position: relative;
    display: flex; align-items:center; justify-content:center;
  }
  .header-icon-btn.has-filter { border-color: var(--accent-color); color: var(--accent-color); }
  .header-icon-btn { transition: transform .12s cubic-bezier(.34,1.56,.64,1), background-color .12s; }
  .header-icon-btn:active { transform: scale(0.86); background: var(--card-bg-2); }
  .header-btn-group { display:flex; gap:8px; flex-shrink:0; }
  .header-icon-btn .dot {
    position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
    background: var(--accent-color); display:none;
  }
  .header-icon-btn.has-filter .dot { display:block; }

  main { padding: 6px 20px 10px; flex: 1; }
  .tab-view { display: none; }
  .tab-view.active { display: block; animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }

  .add-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--accent-color);
    color: #1A140D;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 20px;
    box-shadow: 0 4px 14px rgba(209,154,102,0.25);
    transition: transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s;
  }
  .add-btn:active { transform: scale(0.965); box-shadow: 0 1px 6px rgba(209,154,102,0.2); }

  .section-title {
    font-size: 12px;
    color: var(--sub-text);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .empty-state {
    text-align: center;
    padding: 40px 16px;
    color: var(--sub-text);
    font-size: 13px;
    border: 1px dashed var(--border-color);
    border-radius: 14px;
  }
  .empty-state .e-icon { font-size: 28px; display:block; margin-bottom: 8px; }

  /* カード共通 */
  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }
  .card-title { font-weight: 700; font-size: 15.5px; line-height:1.3; }
  .card-date { font-size: 11.5px; color: var(--sub-text); margin-top: 2px; }
  .del-btn {
    background: none; border: none; color: var(--sub-text);
    font-size: 16px; cursor: pointer; padding: 2px 6px; line-height:1;
    flex-shrink:0;
  }
  .del-btn:active { color: var(--danger); transform: scale(0.88); }
  .card-actions { display: flex; gap: 2px; flex-shrink: 0; }

  /* 左スワイプで削除。カードを translateX で滑らせ、下の削除ボタンを覗かせる */
  .swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    margin-bottom: 12px;
  }
  .swipe-wrap > .card {
    margin-bottom: 0;
    touch-action: pan-y;      /* 横は自前で処理し、縦スクロールはブラウザに任せる */
    will-change: transform;
    position: relative;
    z-index: 1;
  }
  .swipe-delete {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 88px;
    border: none;
    background: var(--danger);
    color: #fff;
    font-size: 13.5px; font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .swipe-delete:active { filter: brightness(0.85); }
  .swipe-hint { font-size: 11px; color: var(--sub-text); margin: -4px 0 12px 2px; }

  /* 豆情報を持つログのタイトルはタップで詳細が開く */
  .card-title.linked {
    color: var(--accent-color-strong); cursor: pointer;
    text-decoration: underline dotted rgba(228,180,131,0.45); text-underline-offset: 3px;
  }

  /* 焙煎度スライダーの目盛り */
  .roast-scale { display: flex; margin-top: 6px; }
  /* 7段階×4文字。iPhone SE 幅(320px)でも隣とくっつかないサイズ */
  .roast-scale span {
    flex: 1; text-align: center; font-size: 9px; color: var(--sub-text);
    transition: color .13s ease;
  }
  .roast-scale span.on { color: var(--accent-color); font-weight: 700; }

  /* 豆情報の定義リスト */
  .bean-spec { display: grid; grid-template-columns: 82px 1fr; gap: 7px 10px; font-size: 13.5px; margin-top: 4px; }
  .bean-spec dt { color: var(--sub-text); font-size: 11.5px; padding-top: 2px; }
  .bean-spec dd { color: var(--text-color); word-break: break-word; }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    background-color: rgba(209,154,102,0.15);
    color: var(--accent-color);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .params-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background-color: rgba(0,0,0,0.2);
    padding: 10px 6px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .params-grid.cols2 { grid-template-columns: repeat(2, 1fr); }
  .param-item { text-align: center; }
  .param-label { font-size: 9.5px; color: var(--sub-text); display: block; margin-bottom: 3px; letter-spacing:.03em;}
  .param-value { font-size: 13px; font-weight: 700; }

  .stars { color: var(--accent-color); font-size: 14px; letter-spacing: 1px; margin-bottom: 6px; }
  .memo-text { font-size: 13px; color: var(--sub-text); line-height: 1.5; }
  .memo-label { font-size: 11px; color: var(--accent-color); font-weight:700; margin-top:8px; margin-bottom:2px; }

  .taste-bars { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .taste-row { display:flex; align-items:center; gap:8px; font-size:11px; color: var(--sub-text); }
  .taste-row .t-label { width: 38px; flex-shrink:0; }
  .taste-track { flex:1; height:5px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; }
  .taste-fill { height:100%; background: var(--accent-color); border-radius:3px; }

  /* 豆DB */
  .best-recipe-box {
    margin-top: 10px;
    border: 1px solid rgba(209,154,102,0.35);
    background: rgba(209,154,102,0.07);
    border-radius: 12px;
    padding: 12px;
  }
  .best-recipe-title {
    font-size: 11.5px; font-weight: 800; color: var(--accent-color);
    display:flex; align-items:center; gap:5px; margin-bottom:8px;
  }

  /* ラテアート */
  .latte-photo {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 10px;
    background: rgba(0,0,0,0.2);
  }

  /* モーダル */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(6,8,12,0.6);
    z-index: 50;
    display: none;
    justify-content: center;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 480px;
    background: var(--bg-color);
    border-radius: 20px 20px 0 0;
    max-height: 88vh;
    /* 縦だけスクロールさせる。overflow-x:auto のままだと iOS で
       中身がはみ出していなくても横にラバーバンドで動いてしまう。 */
    overflow-y: auto;
    overflow-x: hidden;
    touch-action: pan-y;
    overscroll-behavior: contain;
    padding: 16px 20px calc(24px + var(--safe-bottom));
    animation: slideUp .22s ease;
    border-top: 1px solid var(--border-color);
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity:0;} to { transform:none; opacity:1;} }
  .modal-handle { width:36px; height:4px; background: var(--border-color); border-radius:2px; margin: 0 auto 14px; }
  .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
  .modal-title { font-size: 17px; font-weight: 800; }
  .modal-close {
    background:none; border:none; color: var(--sub-text); font-size: 20px; cursor:pointer; padding: 4px 8px;
    transition: transform .12s cubic-bezier(.34,1.56,.64,1), color .12s;
  }
  .modal-close:active { transform: scale(0.82); color: var(--text-color); }

  .method-grid { display:flex; flex-direction:column; gap:10px; }
  .method-card {
    display:flex; align-items:center; gap:12px;
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 14px; padding: 16px; cursor: pointer; text-align:left;
    color: var(--text-color); font-size: 14.5px; font-weight:700;
  }
  .method-card { transition: transform .12s cubic-bezier(.34,1.56,.64,1), background-color .12s; }
  .method-card:active { background: var(--card-bg-2); transform: scale(0.975); }
  .method-card .m-icon { font-size: 22px; }
  .method-card .m-sub { font-size: 11px; color: var(--sub-text); font-weight: 400; margin-top: 2px;}

  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--sub-text); font-weight: 700; margin-bottom: 6px; display:block; letter-spacing:.02em; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  input[type=text], input[type=number], input[type=datetime-local], input[type=date], textarea, select {
    width: 100%;
    /* grid の子は min-width:auto が既定。iOS の date 入力は固有幅が広く、
       これが無いと 2カラムの枠からはみ出して隣と重なる。 */
    min-width: 0;
    max-width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 14.5px;
    font-family: inherit;
  }
  /* iOS Safari は date/datetime を独自幅で描くので、明示的に枠へ収める */
  input[type=date], input[type=datetime-local] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
  }
  .form-row, .form-row3 { min-width: 0; }
  .form-row > .form-group, .form-row3 > .form-group { min-width: 0; }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-color); }
  ::placeholder { color: #545E6E; }

  .star-input { display:flex; gap:6px; font-size: 26px; user-select:none; }
  .star-input span {
    color: #383F4E; cursor:pointer;
    transition: color .12s, transform .12s cubic-bezier(.34,1.56,.64,1);
  }
  .star-input span.on { color: var(--accent-color); }
  .star-input span:active { transform: scale(1.3); }

  .range-group { margin-bottom: 12px; }
  .range-top { display:flex; justify-content:space-between; font-size: 12px; color: var(--sub-text); margin-bottom:4px; }
  .range-top b {
    color: var(--accent-color); font-size: 12px;
    display: inline-block; min-width: 1.4em; text-align: right;
  }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 5px;
    background: rgba(255,255,255,0.08); border-radius: 3px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent-color); cursor:pointer; border: 3px solid var(--bg-color);
    transition: transform .13s cubic-bezier(.34,1.56,.64,1), box-shadow .13s ease;
  }
  /* つまみを掴んでいる間だけ大きくして、指の下でも動いているのが分かるようにする */
  input[type=range]:active::-webkit-slider-thumb {
    transform: scale(1.3);
    box-shadow: 0 0 0 7px rgba(209,154,102,0.16);
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent-color); cursor:pointer; border: 3px solid var(--bg-color);
    transition: transform .13s cubic-bezier(.34,1.56,.64,1);
  }
  input[type=range]:active::-moz-range-thumb { transform: scale(1.3); }

  /* 値が変わった瞬間に一度だけ跳ねる */
  @keyframes valuePop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .pop { animation: valuePop .22s cubic-bezier(.34,1.56,.64,1); }

  .segmented { display:flex; background: var(--card-bg); border:1px solid var(--border-color); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 14px; }
  .segmented button {
    flex:1; padding: 9px 4px; background:none; border:none; color: var(--sub-text);
    font-size: 12.5px; font-weight:700; border-radius: 8px; cursor:pointer;
  }
  .segmented button.active { background: var(--accent-color); color: #1A140D; }

  .save-btn {
    width:100%; padding: 15px; background: var(--accent-color); color:#1A140D;
    border:none; border-radius: 12px; font-size: 15.5px; font-weight:800; cursor:pointer; margin-top: 6px;
  }
  .save-btn { transition: transform .12s cubic-bezier(.34,1.56,.64,1); }
  .save-btn:active { transform: scale(.965); }

  .photo-picker {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border: 1.5px dashed var(--border-color); border-radius: 14px; padding: 24px;
    color: var(--sub-text); font-size: 13px; margin-bottom: 14px; cursor:pointer; text-align:center;
  }
  .photo-picker img { width:100%; border-radius: 10px; margin-bottom: 10px; max-height: 220px; object-fit:cover; }
  .photo-picker .p-icon { font-size: 26px; margin-bottom: 6px; display:block; }
  .photo-picker { transition: border-color .12s, background-color .12s; }
  .photo-picker:active { border-color: var(--accent-color); background: var(--card-bg); }

  /* 豆の写真（複数枚） */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .photo-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .photo-thumb .rm {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(6,8,12,0.72); color: #fff;
    border: none; font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s cubic-bezier(.34,1.56,.64,1);
  }
  .photo-thumb .rm:active { transform: scale(0.82); background: var(--danger); }

  /* 豆情報モーダルでの写真表示 */
  .bean-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
  .bean-photos img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; display: block; }

  /* 写真の拡大表示 */
  .lightbox {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(6,8,12,0.92);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }

  /* ボトムナビ */
  .nav-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    padding-bottom: var(--safe-bottom);
    background-color: rgba(28,34,48,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 20;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--sub-text); font-size: 10px; text-decoration: none;
    padding: 10px 0; flex:1; background:none; border:none; font-family:inherit;
  }
  .nav-item.active { color: var(--accent-color); }
  .nav-icon { font-size: 18px; transition: transform .16s cubic-bezier(.34,1.56,.64,1); }
  .nav-item:active .nav-icon { transform: scale(0.82); }
  .nav-item.active .nav-icon { transform: scale(1.12); }

  .bean-select-wrap { position: relative; }

  /* AIアドバイス */
  .ai-btn {
    width: 100%; margin-top: 10px; padding: 11px;
    background: rgba(209,154,102,0.12);
    border: 1px solid rgba(209,154,102,0.35);
    color: var(--accent-color-strong);
    border-radius: 10px; font-size: 13px; font-weight: 700;
    font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .ai-btn { transition: transform .12s cubic-bezier(.34,1.56,.64,1), background-color .12s; }
  .ai-btn:active { background: rgba(209,154,102,0.2); transform: scale(0.97); }
  .ai-btn:disabled { opacity: .55; cursor: default; }

  .ai-box {
    margin-top: 10px;
    border: 1px solid rgba(209,154,102,0.35);
    background: rgba(209,154,102,0.07);
    border-radius: 12px; padding: 12px;
  }
  .ai-box-title {
    font-size: 11.5px; font-weight: 800; color: var(--accent-color);
    display: flex; align-items: center; gap: 5px; margin-bottom: 8px;
  }
  .ai-cached-note { font-size: 10px; color: var(--sub-text); font-weight: 400; margin-left: auto; }
  .ai-error {
    margin-top: 10px; padding: 11px 12px;
    border: 1px solid rgba(201,123,110,0.4);
    background: rgba(201,123,110,0.08);
    color: var(--danger);
    border-radius: 10px; font-size: 12.5px; line-height: 1.5;
  }
  .ai-loading {
    margin-top: 10px; padding: 16px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--sub-text); font-size: 12.5px;
    border: 1px dashed var(--border-color); border-radius: 10px;
  }
  .spinner {
    width: 15px; height: 15px; flex-shrink: 0;
    border: 2px solid rgba(209,154,102,0.25);
    border-top-color: var(--accent-color);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .pop { animation: none; }
    .add-btn, .save-btn, .method-card, .header-icon-btn, .ai-btn, .modal-close,
    .nav-icon, .star-input span, input[type=range]::-webkit-slider-thumb { transition: none; }
  }
</style>
</head>
<body>

<div class="app-container">
  <datalist id="beanDatalist"></datalist>
  <datalist id="shopDatalist"></datalist>

  <header>
    <div>
      <h1><span class="hicon">☕</span>Brew Log</h1>
    </div>
    <div class="header-btn-group">
      <button class="header-icon-btn" id="headerBeanBtn" onclick="openBeanListModal()" style="display:none;">🫘</button>
      <button class="header-icon-btn" id="headerAnalysisBtn" onclick="openAnalysisModal()" style="display:none;">📊</button>

<script>
/* =========================================================
   共通ユーティリティ
========================================================= */
const LS_KEYS = { brew: 'bl_brewLogs', latte: 'bl_latteArts', cafe: 'bl_cafeNotes', aiCache: 'bl_aiCache', bean: 'bl_beans' };

/* -----------------------------------------------------------
   AIアドバイス連携の設定
   Cloudflare Worker をデプロイしたら、そのURLをここに貼る。
   空文字のままなら AI ボタンは表示されず、従来の端末内分析だけで動く。
   例: 'https://brew-log-api.<サブドメイン>.workers.dev'
----------------------------------------------------------- */
const AI_API_BASE = 'https://brew-log-api.cafe-hitsuji.workers.dev';

function loadData(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; }
  catch (e) { return []; }
}
function saveData(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let brewLogs = loadData(LS_KEYS.brew);
let latteArts = loadData(LS_KEYS.latte);
let cafeNotes = loadData(LS_KEYS.cafe);
let beans = loadData(LS_KEYS.bean);

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
}
function starsStr(n) {
  n = Math.max(0, Math.min(5, Math.round(n || 0)));
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}
function nowLocalDatetime() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function todayDate() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/* =========================================================
   タブ切り替え
========================================================= */
function switchTab(name) {
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('headerSearchBtn').style.display = (name === 'brew') ? 'flex' : 'none';
  document.getElementById('headerAnalysisBtn').style.display = (name === 'brew') ? 'flex' : 'none';
  document.getElementById('headerBeanBtn').style.display = (name === 'brew') ? 'flex' : 'none';
  if (name === 'brew') renderBrewList();
  if (name === 'recipe') renderRecipeList();
  if (name === 'latte') renderLatteList();
  if (name === 'cafe') renderCafeList();
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

/* =========================================================
   豆（Bean）
   ログ側は beanId で豆を参照しつつ、表示名 beanName も持たせている。
   beanName を持たせるのは、豆マスタが無い旧ログや、豆を消したあとのログでも
   集計（MYレシピ・分析・検索）がそのまま動くようにするため。
   豆を編集したら、参照しているログの beanName を貼り直す（syncLogBeanNames）。
========================================================= */
// 中煎り（index 3）が真ん中に来る7段階
const ROAST_LEVELS = ['極浅煎り', '浅煎り', '中浅煎り', '中煎り', '中深煎り', '深煎り', '極深煎り'];
const ROAST_DEFAULT = ROAST_LEVELS.indexOf('中煎り');

// 旧5段階の並び。当時は index を保存していたので、ラベルに読み替えて移行する。
const ROAST_LEVELS_V1 = ['浅煎り', '中煎り', '中深煎り', '深煎り', '極深煎り'];

/** roastLevel を index 保存からラベル保存へ移行する（初回読み込み時に一度だけ効く） */
function migrateBeanRoastLevels() {
  let changed = false;
  beans.forEach(b => {
    if (typeof b.roastLevel === 'string' && /^\d+$/.test(b.roastLevel)) {
      b.roastLevel = ROAST_LEVELS_V1[Number(b.roastLevel)] || '';
      changed = true;
    } else if (typeof b.roastLevel === 'number') {
      b.roastLevel = ROAST_LEVELS_V1[b.roastLevel] || '';
      changed = true;
    }
  });
  if (changed) saveData(LS_KEYS.bean, beans);
}

/** 豆の選択・管理で出す名前。「銘柄名 - 購入店」。 */
function beanLabel(bean) {
  if (!bean) return '';
  return `${bean.name}${bean.shop ? ` - ${bean.shop}` : ''}`;
}
/** 抽出画面のカードに出す名前。銘柄名だけ。 */
function beanLabelShort(bean) {
  return bean ? bean.name : '';
}
function findBean(id) { return beans.find(b => b.id === id) || null; }

/** ログのタイトルに出す名前。豆マスタがあればそちらを正とする。 */
function logBeanLabel(log) {
  const bean = log.beanId ? findBean(log.beanId) : null;
  return bean ? beanLabelShort(bean) : (log.beanName || '');
}

function openBeanListModal() {
  renderBeanList();
  openModal('modalBeanList');
}

function renderBeanList() {
  const wrap = document.getElementById('beanList');
  document.getElementById('beanListHint').style.display = beans.length ? 'block' : 'none';
  if (!beans.length) {
    wrap.innerHTML = `<div class="empty-state"><span class="e-icon">🫘</span>まだ豆が登録されていません<br>購入した豆を登録すると、記録がラクになります</div>`;
    return;
  }
  wrap.innerHTML = beans.map(b => `
    <div class="swipe-wrap">
      <button class="swipe-delete" onclick="deleteBean('${b.id}')">削除</button>
      <div class="card">
        <div class="card-top">
          <div>
            <div class="card-title">🫘 ${escapeHtml(beanLabel(b))}</div>
            <div class="card-date">記録${brewLogs.filter(l => l.beanId === b.id).length}件</div>
          </div>
          <div class="card-actions">
            <button class="del-btn" onclick="startBeanForm('${b.id}')">✏️</button>
          </div>
        </div>
        ${b.roastLevel ? `<span class="badge">${escapeHtml(b.roastLevel)}</span>` : ''}
        ${beanPhotosHtml(b)}
        ${beanSpecHtml(b)}
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('.swipe-wrap > .card').forEach(attachSwipeToDelete);
}

/** 登録済みの写真をタップで拡大できる形で並べる */
function beanPhotosHtml(b) {
  if (!Array.isArray(b.photos) || !b.photos.length) return '';
  return `<div class="bean-photos">${b.photos.map((src, i) =>
    `<img src="${src}" alt="${escapeHtml(b.name)}の写真${i + 1}" onclick="openLightboxSrc(this.src)">`
  ).join('')}</div>`;
}

function beanSpecHtml(b) {
  const rows = [
    ['購入店', b.shop],
    ['銘柄名', b.name],
    ['生産国', b.origin],
    ['農園', b.farm],
    ['品種', b.variety],
    ['精製方法', b.process],
    ['焙煎度', b.roastLevel],
    ['焙煎日', b.roastDate ? formatDate(b.roastDate) : ''],
    ['購入日', b.buyDate ? formatDate(b.buyDate) : ''],
  ].filter(([, v]) => v);
  if (!rows.length) return '';
  return `<dl class="bean-spec">${rows.map(([k, v]) =>
    `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`).join('')}</dl>`;
}

let editingBeanId = null;

function startBeanForm(id) {
  editingBeanId = id || null;
  const b = id ? findBean(id) : null;
  beanFormPhotos = (b && Array.isArray(b.photos)) ? b.photos.slice() : [];
  document.getElementById('beanFormTitle').textContent = b ? '豆を編集' : '豆を登録';
  document.getElementById('beanFormBody').innerHTML = buildBeanFormHtml(b);
  updateShopDatalist();
  renderRoastScale();
  renderBeanPhotoGrid();
  openModal('modalBeanForm');
}

function buildBeanFormHtml(b) {
  const v = (key) => escapeHtml(b && b[key] !== undefined ? b[key] : '');
  const roastIdx = b && ROAST_LEVELS.indexOf(b.roastLevel) >= 0 ? ROAST_LEVELS.indexOf(b.roastLevel) : ROAST_DEFAULT;
  return `
    <div class="form-group">
      <label class="form-label">購入店（過去の入力から選択 or 直接入力）</label>
      <input type="text" id="b_shop" list="shopDatalist" value="${v('shop')}" placeholder="例）〇〇ロースタリー">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">銘柄名</label>
        <input type="text" id="b_name" value="${v('name')}" placeholder="例）イルガチェフェ">
      </div>
      <div class="form-group">
        <label class="form-label">生産国</label>
        <input type="text" id="b_origin" value="${v('origin')}" placeholder="例）エチオピア">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">農園</label>
        <input type="text" id="b_farm" value="${v('farm')}" placeholder="例）コンガ農協">
      </div>
      <div class="form-group">
        <label class="form-label">品種</label>
        <input type="text" id="b_variety" value="${v('variety')}" placeholder="例）ヒブリド・ティピカ">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">精製方法</label>
      <input type="text" id="b_process" value="${v('process')}" placeholder="例）ウォッシュド / ナチュラル">
    </div>
    <div class="form-group">
      <label class="form-label">焙煎度</label>
      <input type="range" min="0" max="${ROAST_LEVELS.length - 1}" step="1" value="${roastIdx}" id="b_roastLevel" oninput="renderRoastScale()">
      <div class="roast-scale" id="roastScale"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">焙煎日</label>
        <input type="date" id="b_roastDate" value="${v('roastDate')}">
      </div>
      <div class="form-group">
        <label class="form-label">購入日</label>
        <input type="date" id="b_buyDate" value="${v('buyDate')}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">写真（パッケージ・豆など。複数可）</label>
      <div class="photo-grid" id="beanPhotoGrid"></div>
      <label class="photo-picker" id="beanPhotoPicker">
        <span class="p-icon">📷</span>
        <span>タップして写真を追加</span>
        <input type="file" accept="image/*" multiple id="b_photoFile" style="display:none" onchange="onBeanPhotoChange(event)">
      </label>
    </div>
    <button class="save-btn" onclick="saveBean()">保存する</button>
  `;
}

/* ---------------------------------------------------------
   豆の写真
   localStorage は数MBしか無いので、原寸のまま入れると
   数枚で容量を使い切る。必ず縮小してから持つ。
--------------------------------------------------------- */
const PHOTO_MAX_EDGE = 1000;   // 長辺の上限(px)
const PHOTO_QUALITY = 0.72;    // JPEG 品質
const PHOTO_MAX_COUNT = 9;

let beanFormPhotos = [];

/** 画像ファイルを縮小して data URL にする */
function downscaleImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('読み込みに失敗しました'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像として開けませんでした'));
      img.onload = () => {
        const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function onBeanPhotoChange(event) {
  const files = Array.from(event.target.files || []);
  event.target.value = ''; // 同じ写真を続けて選べるようにする
  if (!files.length) return;

  const room = PHOTO_MAX_COUNT - beanFormPhotos.length;
  if (room <= 0) { alert(`写真は${PHOTO_MAX_COUNT}枚までです`); return; }

  for (const file of files.slice(0, room)) {
    try {
      beanFormPhotos.push(await downscaleImage(file));
    } catch (err) {
      alert(`写真を追加できませんでした: ${err.message}`);
    }
  }
  if (files.length > room) alert(`写真は${PHOTO_MAX_COUNT}枚までのため、${room}枚だけ追加しました`);
  renderBeanPhotoGrid();
}

function renderRoastScale() {
  const slider = document.getElementById('b_roastLevel');
  const scale = document.getElementById('roastScale');
  if (!slider || !scale) return;
  const cur = Number(slider.value);

  // 初回は組み立て、以降はクラスの付け替えだけ（作り直すとアニメーションが飛ぶ）
  if (scale.children.length !== ROAST_LEVELS.length) {
    scale.innerHTML = ROAST_LEVELS.map(label => `<span>${label}</span>`).join('');
  }
  Array.from(scale.children).forEach((el, i) => {
    const on = i === cur;
    if (on && !el.classList.contains('on')) popElement(el);
    el.classList.toggle('on', on);
  });
}

/** 要素を一度だけ跳ねさせる */
function popElement(el) {
  el.classList.remove('pop');
  void el.offsetWidth; // reflow を挟まないと同じアニメーションが再生されない
  el.classList.add('pop');
}

/** スライダーの数値表示を更新し、変わったときだけ跳ねさせる */
function setRangeValue(id, val) {
  const el = document.getElementById(id);
  if (!el || el.textContent === String(val)) return;
  el.textContent = val;
  popElement(el);
}

}

function saveBean() {
  const name = document.getElementById('b_name').value.trim();
  if (!name) { alert('銘柄名を入力してください'); return; }

  const data = {
    shop: document.getElementById('b_shop').value.trim(),
    name,
    origin: document.getElementById('b_origin').value.trim(),
    farm: document.getElementById('b_farm').value.trim(),
    variety: document.getElementById('b_variety').value.trim(),
    process: document.getElementById('b_process').value.trim(),
    roastLevel: ROAST_LEVELS[Number(document.getElementById('b_roastLevel').value)] || '',
    roastDate: document.getElementById('b_roastDate').value,
    buyDate: document.getElementById('b_buyDate').value,
    photos: beanFormPhotos.slice(),
  };

  // 写真を積むと localStorage の上限に当たりうるので、失敗したら元に戻す
  const snapshot = beans.slice();
  let savedId;
  if (editingBeanId) {
    savedId = editingBeanId;
    const idx = beans.findIndex(b => b.id === savedId);
    if (idx >= 0) beans[idx] = { ...beans[idx], ...data };
  } else {
    savedId = uid();
    beans.unshift({ id: savedId, ...data });
  }
  try {
    saveData(LS_KEYS.bean, beans);
  } catch (err) {
    beans = snapshot;
    alert('保存できませんでした。端末の保存容量が上限に達しています。\n写真を減らすか、古い豆を削除してください。');
    return;
  }

  // 豆名が変わっている可能性があるので、参照しているログの表示名を貼り直す
  syncLogBeanNames();

  editingBeanId = null;
  closeModal('modalBeanForm');
  renderBeanList();
  updateBeanDatalist();
  renderBrewList();

  // 記録フォームから登録した場合は、いま作った豆をそのまま選択状態にする
  const sel = document.getElementById('f_beanSelect');
  if (sel && document.getElementById('modalBrewForm').classList.contains('open')) {
    lastBeanSelectValue = 'id:' + savedId;
    sel.innerHTML = beanOptionsHtml(lastBeanSelectValue);
  }
}

function deleteBean(id) {
  const used = brewLogs.filter(l => l.beanId === id).length;
  const msg = used
    ? `この豆を削除しますか？\n抽出ログ${used}件は残りますが、豆情報は見られなくなります。`
    : 'この豆を削除しますか？';
  if (!confirm(msg)) return;
  beans = beans.filter(b => b.id !== id);
  saveData(LS_KEYS.bean, beans);
  // ログ側の beanName は残したまま、リンクだけ切る
  brewLogs.forEach(l => { if (l.beanId === id) delete l.beanId; });
  saveData(LS_KEYS.brew, brewLogs);
  renderBeanList();
  updateBeanDatalist();
  renderBrewList();
}

/** 豆マスタの表示名を、参照しているログの beanName に反映する */
function syncLogBeanNames() {
  let changed = false;
  brewLogs.forEach(log => {
    if (!log.beanId) return;
    const label = beanLabel(findBean(log.beanId));
    if (label && log.beanName !== label) { log.beanName = label; changed = true; }
  });
  if (changed) saveData(LS_KEYS.brew, brewLogs);
}

/**
 * 豆セレクトの選択肢。値は "id:<豆ID>" か "name:<表示名>"。
 * 豆マスタに無い過去ログの豆名も選べるようにしておく（旧データ救済）。
 */
function beanOptionsHtml(selected) {
  const registered = beans.map(b => ({ value: 'id:' + b.id, label: beanLabel(b) }));
  const legacyNames = Array.from(new Set(
    brewLogs.filter(l => !l.beanId && l.beanName).map(l => l.beanName)
  ));
  const legacy = legacyNames.map(n => ({ value: 'name:' + n, label: n }));

  const group = (label, items) => items.length
    ? `<optgroup label="${label}">${items.map(o =>
        `<option value="${escapeHtml(o.value)}"${o.value === selected ? ' selected' : ''}>${escapeHtml(o.label)}</option>`
      ).join('')}</optgroup>`
    : '';

  return `<option value=""${selected ? '' : ' selected'}>選択してください</option>`
    + group('登録した豆', registered)
    + group('過去の入力', legacy)
    + `<option value="__new__">＋ 新しい豆を登録…</option>`;
}

/** 「＋ 新しい豆を登録…」を選んだら豆フォームを開き、選択は元に戻す */
let lastBeanSelectValue = '';
function onBeanSelectChange(sel) {
  if (sel.value === '__new__') {
    sel.value = lastBeanSelectValue;
    startBeanForm();
    return;
  }
  lastBeanSelectValue = sel.value;
}

function initStarInput(containerId, hiddenValueRef) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement('span');
    s.textContent = '★';
    s.dataset.val = i;
    // 編集時は既存の評価を点灯させた状態から始める
    if (i <= Number(hiddenValueRef.value || 0)) s.classList.add('on');
    s.onclick = () => {
      hiddenValueRef.value = i;
      Array.from(el.children).forEach(c => c.classList.toggle('on', Number(c.dataset.val) <= i));
    };
    el.appendChild(s);
  }
}
const overallRating = { value: 0 };

function saveBrewLog() {
  const sel = document.getElementById('f_beanSelect').value;
  if (!sel) { alert('豆を選択してください'); return; }

  // 値は "id:<豆ID>" か "name:<表示名>"
  let beanId = null;
  let beanName = '';
  if (sel.startsWith('id:')) {
    beanId = sel.slice(3);
    beanName = beanLabel(findBean(beanId));
  } else {
    beanName = sel.slice(5);
  }

  const log = {
    id: editingLogId || uid(),
    method: currentMethod,
    datetime: document.getElementById('f_datetime').value || nowLocalDatetime(),
    beanId,
    beanName,
    dose: document.getElementById('f_dose').value,
    rating: overallRating.value,
    acidity: document.getElementById('r_acidity').value,
    bitterness: document.getElementById('r_bitterness').value,
    sweetness: document.getElementById('r_sweetness').value,
    body: document.getElementById('r_body').value,
    flavorNote: document.getElementById('f_flavorNote').value.trim(),
    improveNote: document.getElementById('f_improveNote').value.trim(),
  };

  if (currentMethod === 'drip') {
    log.waterTemp = document.getElementById('f_waterTemp').value;
    log.grind = document.getElementById('f_grind').value;
    log.waterAmount = document.getElementById('f_waterAmount').value;
    log.time = document.getElementById('f_time').value;
  } else if (currentMethod === 'espresso') {
    log.waterTemp = document.getElementById('f_waterTemp').value;
    log.grind = document.getElementById('f_grind').value;
    log.yield = document.getElementById('f_yield').value;
    log.time = document.getElementById('f_time').value;
  } else if (currentMethod === 'frenchpress') {
    log.waterTemp = document.getElementById('f_waterTemp').value;
    log.grind = document.getElementById('f_grind').value;
    log.waterAmount = document.getElementById('f_waterAmount').value;
    log.time = document.getElementById('f_time').value;
  }

  if (!log.beanId) delete log.beanId;

  if (editingLogId) {
    const idx = brewLogs.findIndex(l => l.id === editingLogId);
    if (idx >= 0) brewLogs[idx] = log;
  } else {
    brewLogs.unshift(log);
  }
  editingLogId = null;

  saveData(LS_KEYS.brew, brewLogs);
  updateBeanDatalist();
  closeModal('modalBrewForm');
  renderBrewList();
}

function deleteBrewLog(id) {
  if (!confirm('この記録を削除しますか？')) return;
  brewLogs = brewLogs.filter(l => l.id !== id);
  saveData(LS_KEYS.brew, brewLogs);
  updateBeanDatalist();
  renderBrewList();
}

/* ---------------------------------------------------------
   左スワイプで削除ボタンを出す
   縦スクロールを殺さないよう、最初の数pxで縦横どちらの操作かを判定し、
   横だと決まったときだけカードを掴む。
--------------------------------------------------------- */
const SWIPE_REVEAL = 88;   // 削除ボタンの幅
const SWIPE_SNAP = 40;     // ここを越えて引いたら開いたままにする
const SWIPE_DECIDE = 8;    // 方向を判定するまでの移動量

function closeSwipedCards(except) {
  document.querySelectorAll('.swipe-wrap > .card').forEach(c => {
    if (c === except) return;
    if (c._swipeOpen) {
      c._swipeOpen = false;
      c.style.transition = 'transform .2s ease';
      c.style.transform = 'translateX(0)';
    }
  });
}

function attachSwipeToDelete(card) {
  let startX = 0, startY = 0, base = 0, axis = null, pointerId = null;

  card.addEventListener('pointerdown', (e) => {
    // ボタンやリンクの上から始まったスワイプは無視する
    if (e.target.closest('button, .card-title.linked')) return;
    card._suppressClick = false;
    pointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    base = card._swipeOpen ? -SWIPE_REVEAL : 0;
    axis = null;
    card.style.transition = 'none';
  });

  card.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!axis) {
      if (Math.abs(dx) < SWIPE_DECIDE && Math.abs(dy) < SWIPE_DECIDE) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (axis === 'x') {
        closeSwipedCards(card);
        card.setPointerCapture(pointerId);
      }
    }
    if (axis !== 'x') return;

    // 右方向には開かない（0 が上限）。左は削除ボタン幅まで。
    const next = Math.max(-SWIPE_REVEAL, Math.min(0, base + dx));
    card.style.transform = `translateX(${next}px)`;
  });

  const finish = (e) => {
    if (pointerId === null || (e && e.pointerId !== pointerId)) return;
    const wasX = axis === 'x';
    pointerId = null; axis = null;
    if (!wasX) return;
    // スワイプ直後に発火する click（写真の拡大など）を一度だけ握りつぶす
    card._suppressClick = true;

    const cur = new DOMMatrixReadOnly(getComputedStyle(card).transform).m41;
    card._swipeOpen = cur < -SWIPE_SNAP;
    card.style.transition = 'transform .2s cubic-bezier(.22,1,.36,1)';
    card.style.transform = `translateX(${card._swipeOpen ? -SWIPE_REVEAL : 0}px)`;
  };
  card.addEventListener('pointerup', finish);
  card.addEventListener('pointercancel', finish);

  card.addEventListener('click', (e) => {
    if (card._suppressClick) {
      card._suppressClick = false;
      e.stopPropagation();
      e.preventDefault();
      return;
    }
    // 開いているカードの本体をタップしたら閉じる（削除の誤爆を防ぐ）
    if (card._swipeOpen && !e.target.closest('button')) {
      e.stopPropagation();
      e.preventDefault();
      closeSwipedCards(null);
    }
  }, true);
}

/* =========================================================
   分析（過去ログからのおすすめ抽出設定）
========================================================= */
function parseTimeToSeconds(str) {
  if (!str) return null;
  const s = String(str).trim();
  if (s.includes(':')) {
    const [m, sec] = s.split(':').map(v => parseFloat(v));
    if (isNaN(m) || isNaN(sec)) return null;
    return m * 60 + sec;
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function secondsToTimeStr(totalSec) {
  const t = Math.round(totalSec);
  const m = Math.floor(t / 60);
  const s = t % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function weightedAvgField(logs, field) {
  let sumVal = 0, sumWeight = 0;
  logs.forEach(l => {
    const n = parseFloat(l[field]);
    if (!isNaN(n)) {
      const w = Math.max(1, Number(l.rating) || 1);
      sumVal += n * w;
      sumWeight += w;
    }
  });
  return sumWeight ? sumVal / sumWeight : null;
}

function weightedModeField(logs, field) {
  const scores = {};
  logs.forEach(l => {
    const v = (l[field] || '').toString().trim();
    if (!v) return;
    const w = Math.max(1, Number(l.rating) || 1);
    scores[v] = (scores[v] || 0) + w;
  });
  let best = null, bestScore = -1;
  Object.keys(scores).forEach(k => { if (scores[k] > bestScore) { best = k; bestScore = scores[k]; } });
  return best;
}

function openAnalysisModal() {
  const select = document.getElementById('an_bean');

function buildRecommendationCard(method, logs, beanName) {
  const count = logs.length;
  const avgRating = logs.reduce((sum, l) => sum + (Number(l.rating) || 0), 0) / count;
  const dose = weightedAvgField(logs, 'dose');
  const grind = weightedModeField(logs, 'grind');

  let paramsHtml = '';
  if (method === 'drip' || method === 'frenchpress') {
    const waterTemp = weightedAvgField(logs, 'waterTemp');
    const waterAmount = weightedAvgField(logs, 'waterAmount');
    const secs = logs.map(l => ({ sec: parseTimeToSeconds(l.time), w: Math.max(1, Number(l.rating) || 1) })).filter(x => x.sec !== null);
    const timeAvgSec = secs.length ? secs.reduce((s, x) => s + x.sec * x.w, 0) / secs.reduce((s, x) => s + x.w, 0) : null;
    paramsHtml = `<div class="params-grid">
      <div class="param-item"><span class="param-label">粉量</span><span class="param-value">${dose !== null ? dose.toFixed(1) + 'g' : '-'}</span></div>
      <div class="param-item"><span class="param-label">湯量</span><span class="param-value">${waterAmount !== null ? Math.round(waterAmount) + 'g' : '-'}</span></div>
      <div class="param-item"><span class="param-label">湯温</span><span class="param-value">${waterTemp !== null ? Math.round(waterTemp) + '℃' : '-'}</span></div>
      <div class="param-item"><span class="param-label">挽き目</span><span class="param-value">${grind ? escapeHtml(grind) : '-'}</span></div>
      <div class="param-item"><span class="param-label">${method === 'drip' ? '時間' : '浸漬時間'}</span><span class="param-value">${timeAvgSec !== null ? secondsToTimeStr(timeAvgSec) : '-'}</span></div>
    </div>`;
  } else {
    const waterTemp = weightedModeField(logs, 'waterTemp');
    const yieldAmt = weightedAvgField(logs, 'yield');
    const timeSecs = weightedAvgField(logs, 'time');
    paramsHtml = `<div class="params-grid">
      <div class="param-item"><span class="param-label">In</span><span class="param-value">${dose !== null ? dose.toFixed(1) + 'g' : '-'}</span></div>
      <div class="param-item"><span class="param-label">Out</span><span class="param-value">${yieldAmt !== null ? yieldAmt.toFixed(1) + 'g' : '-'}</span></div>
      <div class="param-item"><span class="param-label">時間</span><span class="param-value">${timeSecs !== null ? Math.round(timeSecs) + '秒' : '-'}</span></div>
      <div class="param-item"><span class="param-label">湯温</span><span class="param-value">${waterTemp ? escapeHtml(waterTemp) : '-'}</span></div>
      <div class="param-item"><span class="param-label">挽き目</span><span class="param-value">${grind ? escapeHtml(grind) : '-'}</span></div>
    </div>`;
  }

  const adviceText = count < 2
    ? 'この豆・方式の記録がまだ少ないため参考程度にご覧ください。記録が増えるほど精度が上がります。'
    : `${count}件の記録（平均評価 ${avgRating.toFixed(1)}）をもとに、評価の高い記録ほど重視して算出したおすすめ設定です。`;

  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-title">${brewMethodBadge(method)}</div>
          <div class="card-date">記録${count}件 ・ 平均★${avgRating.toFixed(1)}</div>
        </div>
      </div>
      <div class="best-recipe-box">
        <div class="best-recipe-title">📊 おすすめ設定（端末内の統計）</div>
        ${paramsHtml}
        <div class="memo-text" style="margin-top:8px;">${adviceText}</div>
      </div>
      ${aiSectionHtml(method, logs, beanName)}
    </div>
  `;
}

/* =========================================================
   AIアドバイス（オンライン時のみ。統計分析は常にそのまま残る）
========================================================= */

/**
 * その豆・その抽出方法のログ群から、AI に渡す豆情報を作る。
 * 豆マスタに紐づいていないログ（旧データ）は null。
 * 焙煎度は数値のままだと AI に伝わらないのでラベルに直す。
 */
function aiBeanPayload(logs) {
  const withBean = logs.find(l => l.beanId);
  const bean = withBean ? findBean(withBean.beanId) : null;
  if (!bean) return null;
  return {
    shop: bean.shop || '',
    name: bean.name || '',
    origin: bean.origin || '',
    farm: bean.farm || '',
    variety: bean.variety || '',
    process: bean.process || '',
    roastLevel: bean.roastLevel || '',
    roastDate: bean.roastDate || '',
    buyDate: bean.buyDate || '',
  };
}

/** ログか豆情報が1つでも変われば別キーになるハッシュ */
function aiCacheKey(beanName, method, logs) {
  const src = JSON.stringify([beanName, method, logs, aiBeanPayload(logs)]);
  let h = 5381;
  for (let i = 0; i < src.length; i++) h = ((h * 33) ^ src.charCodeAt(i)) >>> 0;
  return `${method}:${h.toString(36)}`;
}

function loadAiCache() {
  try { return JSON.parse(localStorage.getItem(LS_KEYS.aiCache)) || {}; }
  catch (e) { return {}; }
}

function saveAiCacheEntry(key, data) {
  const cache = loadAiCache();
  cache[key] = { data, at: Date.now() };
  // 肥大化防止：古いものから捨てて30件に収める
  const keys = Object.keys(cache).sort((a, b) => cache[b].at - cache[a].at);
  const trimmed = {};
  keys.slice(0, 30).forEach(k => { trimmed[k] = cache[k]; });
  try { localStorage.setItem(LS_KEYS.aiCache, JSON.stringify(trimmed)); }
  catch (e) { /* 容量オーバー時はキャッシュを諦める */ }
}

/** 分析カード内のAI欄。キャッシュがあれば即座に描画する */
function aiSectionHtml(method, logs, beanName) {
  if (!AI_API_BASE) return '';
  const cached = loadAiCache()[aiCacheKey(beanName, method, logs)];
  const body = cached
    ? aiResultHtml(cached.data, cached.at)
    : `<button class="ai-btn" onclick="requestAiAdvice('${method}')">🤖 AIに詳しくアドバイスをもらう</button>`;
  return `<div id="aiSlot-${method}">${body}</div>`;
}

function aiResultHtml(data, cachedAt) {
  const rec = data.recommendation || {};
  const cell = (label, value) => (value && value !== '-')
    ? `<div class="param-item"><span class="param-label">${label}</span><span class="param-value">${escapeHtml(value)}</span></div>`
    : '';
  const params = [
    cell('粉量', rec.dose), cell('湯量', rec.waterAmount), cell('抽出量', rec.yield),
    cell('湯温', rec.waterTemp), cell('挽き目', rec.grind), cell('時間', rec.time),
  ].join('');
  const note = cachedAt ? `<span class="ai-cached-note">${formatDateTime(new Date(cachedAt).toISOString())} の結果</span>` : '';
  return `
    <div class="ai-box">
      <div class="ai-box-title">🤖 AIのアドバイス${note}</div>
      ${params ? `<div class="params-grid">${params}</div>` : ''}
      ${data.advice ? `<div class="memo-text">${escapeHtml(data.advice)}</div>` : ''}
      ${data.nextExperiment ? `<div class="memo-label">次に試すこと</div><div class="memo-text">${escapeHtml(data.nextExperiment)}</div>` : ''}
    </div>`;
}

async function requestAiAdvice(method) {
  const slot = document.getElementById('aiSlot-' + method);
  if (!slot) return;
  const beanName = document.getElementById('an_bean').value;
  const logs = brewLogs.filter(l => l.beanName === beanName && l.method === method);
  if (!beanName || !logs.length) return;

  if (!navigator.onLine) {
    slot.innerHTML = `<div class="ai-error">オフラインのため AI アドバイスを取得できません。上の統計分析はそのまま使えます。</div>
      <button class="ai-btn" onclick="requestAiAdvice('${method}')">再試行</button>`;
    return;
  }

  slot.innerHTML = `<div class="ai-loading"><span class="spinner"></span>AI が過去ログを読んでいます…</div>`;

  // モバイル回線で固まらないよう上限を切る
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 60000);

  try {
    const res = await fetch(AI_API_BASE + '/api/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ beanName, method, logs, bean: aiBeanPayload(logs) }),
      signal: controller.signal,
    });
    const payload = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(payload.error || `サーバーエラー (${res.status})`);

    saveAiCacheEntry(aiCacheKey(beanName, method, logs), payload);
    slot.innerHTML = aiResultHtml(payload, null);
  } catch (err) {
    const msg = err.name === 'AbortError'
      ? '応答が時間内に返りませんでした。'
      : (err.message || '通信に失敗しました。');
    slot.innerHTML = `<div class="ai-error">${escapeHtml(msg)}<br>上の統計分析はそのまま使えます。</div>
      <button class="ai-btn" onclick="requestAiAdvice('${method}')">再試行</button>`;
  } finally {
    clearTimeout(timer);
  }
}

/* =========================================================
   MYレシピ（豆ごとのベストレシピ自動表示）
========================================================= */
function bestRecipeFor(beanName) {
  const logs = brewLogs.filter(l => l.beanName === beanName);
  if (!logs.length) return null;
  return logs.reduce((best, cur) => (Number(cur.rating) > Number(best.rating) ? cur : best), logs[0]);
}

function renderRecipeList() {
  const wrap = document.getElementById('recipeList');
  const uniqueNames = Array.from(new Set(brewLogs.map(l => l.beanName).filter(Boolean)));

  if (!uniqueNames.length) {

    return;
  }

  const recipes = uniqueNames.map(name => ({ name, best: bestRecipeFor(name), count: brewLogs.filter(l => l.beanName === name).length }));
  recipes.sort((a, b) => Number(b.best.rating) - Number(a.best.rating));

  wrap.innerHTML = recipes.map(r => `

      </div>
      ${l.milkNote ? `<div class="memo-label">ミルク / スチームメモ</div><div class="memo-text">${escapeHtml(l.milkNote)}</div>` : ''}
      ${l.comment ? `<div class="memo-label">コメント</div><div class="memo-text">${escapeHtml(l.comment)}</div>` : ''}
    </div>
  `).join('');
}

/* =========================================================
   カフェ・外飲みログ
========================================================= */
let pendingCafePhoto = '';

function resetCafePicker() {
  pendingCafePhoto = '';
  document.getElementById('cafePickerLabel').innerHTML = `
    <span class="p-icon">📷</span><span>タップして写真を選択（任意）</span>
    <input type="file" accept="image/*" id="cafeFile" style="display:none" onchange="onCafePhotoChange(event)">
  `;
}

function onCafePhotoChange(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingCafePhoto = e.target.result;
    document.getElementById('cafePickerLabel').innerHTML = `
      <img src="${pendingCafePhoto}" alt="cafe">
      <span>タップして写真を変更</span>
      <input type="file" accept="image/*" id="cafeFile" style="display:none" onchange="onCafePhotoChange(event)">
    `;
  };
  reader.readAsDataURL(file);
}

function openCafeModal() {
  document.getElementById('cafeDate').value = todayDate();
  document.getElementById('cafeShop').value = '';
  document.getElementById('cafeMenu').value = '';
  document.getElementById('cafeFlavor').value = '';
  resetCafePicker();
  openModal('modalCafe');
}

function saveCafe() {
  const shop = document.getElementById('cafeShop').value.trim();
  if (!shop) { alert('店名を入力してください'); return; }
  cafeNotes.unshift({
    id: uid(),
    date: document.getElementById('cafeDate').value || todayDate(),
    shop,
    menu: document.getElementById('cafeMenu').value.trim(),
    flavor: document.getElementById('cafeFlavor').value.trim(),
    photo: pendingCafePhoto,
  });
  saveData(LS_KEYS.cafe, cafeNotes);
  closeModal('modalCafe');
  renderCafeList();
}

function deleteCafe(id) {
  if (!confirm('この記録を削除しますか？')) return;
  cafeNotes = cafeNotes.filter(c => c.id !== id);
  saveData(LS_KEYS.cafe, cafeNotes);
  renderCafeList();
}

function renderCafeList() {
  const wrap = document.getElementById('cafeList');
  if (!cafeNotes.length) {
    wrap.innerHTML = `<div class="empty-state"><span class="e-icon">🏪</span>まだ記録がありません<br>外で飲んだ一杯を記録しましょう</div>`;
    return;
  }
  wrap.innerHTML = cafeNotes.map(c => `
    <div class="card">
      ${c.photo ? `<img class="latte-photo" src="${c.photo}" alt="cafe">` : ''}
      <div class="card-top">
        <div>
          <div class="card-title">🏪 ${escapeHtml(c.shop)}</div>
          <div class="card-date">${formatDate(c.date)}${c.menu ? ' • ' + escapeHtml(c.menu) : ''}</div>
        </div>
        <button class="del-btn" onclick="deleteCafe('${c.id}')">×</button>
      </div>
      ${c.flavor ? `<div class="memo-text">${escapeHtml(c.flavor)}</div>` : ''}
    </div>
  `).join('');
}
